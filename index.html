<script>
(()=>{'use strict';
const C=document.querySelector('#game'),x=C.getContext('2d'),W=C.width,H=C.height,keys={},mouse={x:W/2,y:H/2,down:false,right:false};
let scene='menu',level=0,last=0,cam={x:0,y:0},player, enemies, allies, covers, trenches, vehicles, enemyVehicles, bullets, grenades, effects, pickups, startedAt, killed, toastTimer=0,training=false,zombieMode=false,campaignArmor=0,mission,wave=0,waveDelay=2,defenseLines=[],defenseExpansion=0,factory,autoSummon={type:'rifle',cooldown:0},zombieFrame=0,loopPending=false;

 {name:'第一关 · 边境哨站',w:2400,h:1800,enemies:14,mg:2,sniper:2,engineer:1,turret:0,goal:{x:2240,y:150},vehicles:['humvee','apc'],enemyVehicles:['humvee'],theme:'#50643b',entry:'tunnel',exit:'heli'},

);

const trainingLevel={name:'训练场',w:2400,h:1800,enemies:8,mg:3,sniper:3,engineer:3,turret:2,goal:{x:2240,y:150},vehicles:['humvee','apc','hstv','m1','t90m','bmpt','apache'],enemyVehicles:['humvee','apc','hstv','m1','t90m','bmpt','apache'],theme:'#4c623f',entry:'tunnel',exit:'heli'};
const zombieLevel={name:'丧尸模式 · 城区兵工厂',w:4200,h:3200,enemies:0,mg:0,sniper:0,engineer:0,turret:0,goal:{x:-500,y:-500},vehicles:['humvee','apc','hstv','m1','t90m','bmpt','apache'],enemyVehicles:[],theme:'#343b39',entry:'tunnel',exit:'tunnel'};
const campaignLevelZero=levels[0];
const SAVE_KEY='position_breakout_save_v2';
function loadCampaignSave(){try{let bundled=GameSaveSystem?.loadSection('campaign',null),raw=localStorage.getItem(SAVE_KEY),s=bundled|| (raw?JSON.parse(raw):{});return {maxUnlocked:clamp(finite(s.maxUnlocked,0),0,levels.length-1),completed:clamp(finite(s.completed,-1),-1,levels.length-1),armor:clamp(finite(s.armor,0),0,80)}}catch(e){return {maxUnlocked:0,completed:-1,armor:0}}}
let campaignSave=loadCampaignSave();campaignArmor=campaignSave.armor;
function persistCampaignSave(){campaignSave.armor=campaignArmor;let protectedSave=GameSaveSystem?.saveSection('campaign',campaignSave)??true;try{localStorage.setItem(SAVE_KEY,JSON.stringify(campaignSave));return protectedSave}catch(e){return false}}
function completeCampaignLevel(index){if(index<0||index>=levels.length)return;campaignSave.completed=Math.max(campaignSave.completed,index);campaignSave.maxUnlocked=Math.max(campaignSave.maxUnlocked,Math.min(levels.length-1,index+1));campaignArmor=Math.min(80,(campaignSave.completed+1)*10);persistCampaignSave();message(`战役进度已保存 · 护甲成长 ${campaignArmor}%`)}
const allyCosts={rifle:2,mg:4,sniper:6,engineer:8};
const reinforcementNames={rifle:'步枪兵',mg:'机枪兵',sniper:'狙击兵',engineer:'工兵',flamer:'喷火兵',humvee:'悍马军用车',apc:'CM34装甲车',hstv:'HSTV轻型坦克',m1:'M1主战坦克',t90m:'T-90M主战坦克',bmpt:'BMPT坦克歼击车',apache:'守护者阿帕奇直升机'};
const reinforcementName=type=>reinforcementNames[type]||type;
const weaponSpecs=[{name:'突击步枪',cap:30,reload:1.8},{name:'霰弹枪',cap:8,reload:2.2},{name:'轻机枪',cap:80,reload:3.2},{name:'狙击步枪',cap:5,reload:3.5},{name:'RPG',cap:1,reload:5},{name:'毒刺导弹',cap:1,reload:5.5}];
const shellTypes={he:{name:'榴弹',damage:1,blast:1,vehicle:10,crew:0,interceptable:true,color:'#ffbf54'},heat:{name:'破甲弹',damage:1.15,blast:.42,vehicle:45,crew:.12,interceptable:true,color:'#ff7655'},ap:{name:'穿甲弹',damage:1.85,blast:0,vehicle:100,crew:0,interceptable:false,penetration:7,color:'#e7f1ff'}};
function configureShell(b,kind,baseDamage,baseBlast,normalLife){let s=shellTypes[kind];b.shell=true;b.shellKind=kind;b.damage=baseDamage*s.damage;b.vehicleMult=s.vehicle;b.crewDamage=s.crew;b.interceptable=s.interceptable;b.penetration=s.penetration||0;b.pierce=s.penetration||0;b.blast=baseBlast*s.blast;b.life=kind==='ap'?Infinity:normalLife;b.r=kind==='ap'?6:kind==='heat'?8:10;b.color=s.color;return b}
function detonateShell(b){if(b.detonated)return;b.detonated=true;if(b.blast)blast({x:b.x,y:b.y,r:b.blast,damage:b.damage,from:b.from,owner:b.owner});b.life=0}
function guideMissile(b,dt){if(!b.target||b.target.dead)return;let desired=Math.atan2(b.target.y-b.y,b.target.x-b.x),current=Math.atan2(b.vy,b.vx),diff=Math.atan2(Math.sin(desired-current),Math.cos(desired-current)),next=current+clamp(diff,-b.turnRate*dt,b.turnRate*dt),speed=Math.hypot(b.vx,b.vy);b.vx=Math.cos(next)*speed;b.vy=Math.sin(next)*speed}
function rnd(a,b){return a+Math.random()*(b-a)} function clamp(v,a,b){return Math.max(a,Math.min(b,v))} function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function finite(n,fallback=0){return Number.isFinite(n)?n:fallback}
function sanitizeCombatState(){if(player){player.hp=clamp(finite(player.hp,100),0,100);player.armor=clamp(finite(player.armor,0),0,100)}for(const e of enemies||[]){e.hp=clamp(finite(e.hp,e.maxHp||1),0,e.maxHp||1)}for(const a of allies||[]){a.hp=clamp(finite(a.hp,a.maxHp||1),0,a.maxHp||1)}for(const v of [...(vehicles||[]),...(enemyVehicles||[])]){v.max=Math.max(1,finite(v.max,1));v.hp=clamp(finite(v.hp,v.max),0,v.max)}}
function message(s){const e=document.querySelector('#toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1500)}
function scheduleGameLoop(){if(loopPending||!(scene==='play'||scene==='loading'))return;loopPending=true;requestAnimationFrame(loop)}
function startGame(n=0,isTraining=false,isZombie=false){level=clamp(n,0,levels.length-1);training=isTraining;zombieMode=isZombie;GameAudio.setMode(isZombie?'zombie':isTraining?'training':'campaign');GameAudio.unlock();levels[0]=isZombie?zombieLevel:isTraining?trainingLevel:campaignLevelZero;scene='play';document.querySelector('#menu').classList.add('hidden');document.querySelector('#overlay').classList.add('hidden');buildLevel();disperseVehicleSpawns();setupMission(activeLevel());if(training)configureTrainingTargets();if(zombieMode){setupZombieMode();populateZombieCity()}startedAt=performance.now();last=startedAt;scheduleGameLoop()}
function activeLevel(){return zombieMode?zombieLevel:training?trainingLevel:levels[level]}
function disperseVehicleSpawns(){let L=activeLevel();if(training){let place=(group,enemy)=>group.forEach((v,i)=>{let col=i%4,row=Math.floor(i/4);v.x=clamp(L.w*((enemy?.62:.13)+col*.085),v.r+45,L.w-v.r-45);v.y=clamp(L.h*(.28+row*.38),v.r+45,L.h-v.r-45);if(v.type==='apache'){v.x=L.w*(enemy?.78:.22);v.y=L.h*.76;v.altitude=170}v.angle=enemy?Math.PI:0;v.turret=v.angle});place(vehicles,false);place(enemyVehicles,true)}else{let spots=[[.18,.25],[.79,.23],[.22,.76],[.76,.74],[.5,.34],[.5,.78],[.34,.52],[.67,.52]];let occupied=[];for(const [group,offset,enemy]of[[vehicles,0,false],[enemyVehicles,4,true]])group.forEach((v,i)=>{let p=spots[(i+offset)%spots.length],candidate=v.type==='apache'?{x:L.w*(enemy?.82:.58),y:L.h*.18}:{x:L.w*p[0],y:L.h*p[1]};for(let tries=0;tries<16&&occupied.some(o=>dist(o,candidate)<o.r+v.r+80);tries++){let a=(i*2.4+tries)*1.7,ring=110+Math.floor(tries/4)*80,origin=v.type==='apache'?[enemy?.82:.58,.18]:p;candidate.x=clamp(L.w*origin[0]+Math.cos(a)*ring,v.r+30,L.w-v.r-30);candidate.y=clamp(L.h*origin[1]+Math.sin(a)*ring,v.r+30,L.h-v.r-30)}v.x=candidate.x;v.y=candidate.y;if(v.type==='apache')v.altitude=170;occupied.push(v)})}covers=covers.filter(c=>[...vehicles,...enemyVehicles].every(v=>dist(c,v)>c.r+v.r+65))}
function populateZombieCity(){covers=covers.filter(c=>dist(c,factory)>760);for(let i=0;i<75;i++){let type=i%5===0?'wall':i%3===0?'crate':'building',r=type==='building'?rnd(52,88):type==='wall'?rnd(36,64):rnd(18,28),p={x:rnd(110,zombieLevel.w-110),y:rnd(110,zombieLevel.h-110),r,type,hp:type==='crate'?70:999};if(dist(p,factory)>760&&!solid(p,r+18))covers.push(p)}}
function configureTrainingTargets(){for(const e of enemies){e.trainingTarget=true;e.speed=0;e.detect=0;e.alert=-999}for(const v of enemyVehicles){v.trainingTarget=true;v.fire=Infinity;v.coaxFire=Infinity;v.aaFire=Infinity;v.stationary=-Infinity;v.disabled=true}}
function resetTrainingTargets(){if(!training)return;for(const e of enemies){e.dead=false;e.hp=e.maxHp;e.hit=0;e.alert=-999}for(const v of enemyVehicles){v.dead=false;v.hp=v.max;v.enemyCrew=v.capacity;v.aps=v.type==='m1'?4:0;v.disabled=true;v.fire=Infinity;v.coaxFire=Infinity;v.aaFire=Infinity}message('训练标靶已全部重置')}
function resupplyTraining(){if(!training)return;player.hp=100;player.armor=100;player.ammo=weaponSpecs.map(w=>w.cap);player.reserve=[150,48,240,25,8,6];player.grenades=3;if(player.inVehicle){let v=player.inVehicle;v.hp=v.max;v.disabled=false;v.heat=0;v.overheated=false;v.aps=v.type==='m1'?4:v.aps;v.missileAmmo=4;v.missileReload=0}message('训练补给完成：生命、护甲与弹药已恢复')}
function setupMission(L){let types=['clear','vehicles','capture','turrets','commander','capture','vehicles','commander','clear'],type=training?'training':types[level]||'clear';mission={type,target:{x:L.w*.62,y:L.h*.46},hold:0,required:5,label:'',contested:false};if(type==='clear')mission.label='歼灭战区全部敌军';if(type==='vehicles')mission.label='摧毁敌方全部载具';if(type==='capture'){mission.label='占领前沿据点';covers=covers.filter(c=>dist(c,mission.target)>c.r+125);trenches=trenches.filter(t=>dist(t,mission.target)>180)}if(type==='turrets')mission.label='摧毁敌军火力点';if(type==='commander'){let c=enemies.find(e=>e.type==='turret')||enemies[0];if(c){c.commander=true;c.hp=250;c.maxHp=250}mission.commander=c;mission.label='击杀敌军指挥官'}if(type==='training')mission.label='自由训练：敌军不会反击'}

// 工兵维护策略：严格由内向外修复，任何既有墙段未修满时暂停升级。
updateModularDefenses=function(dt){
  if(!zombieMode)return;
  for(let i=0;i<defenseLines.length;i++){
    const line=defenseLines[i];
    if(!Array.isArray(line.segments))defenseLines[i]=makeDefenseLine(finite(line.radius,300+i*120),clamp(finite(line.level,0),0,2),finite(line.id,i))
  }
  for(const zombie of enemies){
    if(!zombie.zombie||zombie.dead||!zombie._blockedDefense)continue;
    zombie.wallMelee=finite(zombie.wallMelee,0)-dt;
    if(zombie.wallMelee<=0){
      const segment=zombie._blockedDefense.segment;
      segment.hp=Math.max(0,segment.hp-zombie.damage);
      if(segment.hp<=0)segment.breached=true;
      zombie.wallMelee=zombie.large?.55:1
    }
  }
  const engineers=allies.filter(ally=>!ally.dead&&ally.type==='engineer').length;
  if(!engineers)return;
  const orderedLines=[...defenseLines].sort((a,b)=>a.radius-b.radius);
  let repair=null;
  for(const line of orderedLines){
    const damaged=line.segments.filter(segment=>segment.hp<segment.max);
    if(!damaged.length)continue;
    damaged.sort((a,b)=>Number(b.breached)-Number(a.breached)||a.hp/a.max-b.hp/b.max);
    repair=damaged[0];
    break
  }
  if(repair){
    repair.hp=Math.min(repair.max,repair.hp+engineers*8*dt);
    if(repair.breached&&repair.hp>=repair.max*.25){
      repair.breached=false;
      message('内侧防线缺口已封闭，工兵继续恢复完整耐久')
    }
    return
  }
  let upgrade=null,upgradeLine=null;
  for(const line of orderedLines){
    upgrade=line.segments.find(segment=>segment.level<3&&segment.hp>=segment.max);
    if(upgrade){upgradeLine=line;break}
  }
  if(upgrade){
    upgrade.build=finite(upgrade.build,0)+engineers*.2*dt;
    if(upgrade.build>=10){
      upgrade.build=0;upgrade.level++;
      upgrade.max=zombieDefenseDurability[upgrade.level];
      upgrade.hp=upgrade.max;upgrade.fire=0;
      const ring=orderedLines.indexOf(upgradeLine)+1;
      message(upgrade.level===1?`内侧第 ${ring} 圈：战壕升级为铁丝网`:upgrade.level===2?`内侧第 ${ring} 圈：铁丝网升级为城墙`:`内侧第 ${ring} 圈：城墙升级为狙击堡垒`)
    }
    return
  }
  if(defenseLines.length<6){
    defenseExpansion+=engineers*.2*dt;
    if(defenseExpansion>=10){
      defenseExpansion=0;
      defenseLines.push(makeDefenseLine(300+defenseLines.length*120,0,defenseLines.length));
      message(`建成第 ${defenseLines.length} 层模块化防线（上限 6 层）`)
    }
  }
};

function sanitizeFrontlineState(){
  if(!frontline)return;
  frontline.points=clamp(finite(frontline.points,0),0,99);
  frontline.enemyPoints=clamp(finite(frontline.enemyPoints,0),0,99);
  frontline.income=Math.max(0,finite(frontline.income,1));
  frontline.enemyIncome=Math.max(0,finite(frontline.enemyIncome,1));
  frontline.time=Math.max(0,finite(frontline.time,0));
  for(const h of frontline.hq||[]){
    h.max=Math.max(100,finite(h.max,1400));
    h.hp=clamp(finite(h.hp,h.max),0,h.max);
    h.level=clamp(Math.round(finite(h.level,1)),1,5);
    h.fire=Math.max(-1,finite(h.fire,0));
    h.missileFire=Math.max(-1,finite(h.missileFire,0));
    h.shieldFlash=Math.max(0,finite(h.shieldFlash,0))

  for(const t of frontline.lines||[]){
    t.x=finite(t.x,640);t.owner=[-1,0,1].includes(t.owner)?t.owner:0;
    t.control=clamp(finite(t.control,0),-100,100);
    t.fort=clamp(Math.round(finite(t.fort,1)),1,3);
    t.fortifyCooldown=Math.max(0,finite(t.fortifyCooldown,0));
    t.turretLosses=Math.max(0,Math.round(finite(t.turretLosses,0)))

  frontline.units=(frontline.units||[]).filter(u=>{
    let d=frontlineDef(u);
    if(!u||!d)return false;
    u.x=clamp(finite(u.x,u.side===1?70:1210),35,1245);
    u.y=finite(u.y,frontline.ground-20);
    u.maxHp=Math.max(1,finite(u.maxHp,d.hp||100));
    u.hp=clamp(finite(u.hp,u.maxHp),0,u.maxHp);
    u.fire=clamp(finite(u.fire,0),-1,30);
    u.suppression=clamp(finite(u.suppression,0),0,100);

// BMPT重装甲强化：T-90M级防护、双倍CM34机炮与等效两名工兵的双联火箭。
const frontlineBmptSpawn=spawnFrontlineVehicle;
spawnFrontlineVehicle=function(type,side){
  let before=frontline?.units?.length||0,ok=frontlineBmptSpawn(type,side);
  if(ok&&type==='bmpt'&&frontline.units.length>before){
    let u=frontline.units[frontline.units.length-1];
    u.bmptRocketFire=rnd(.5,1.4)
  }
  return ok
};

function frontlineBmptRocketVolley(u,target){
  let d=frontlineVehicleDefs.bmpt,impact=d.rocketDamage*(target.kind==='vehicle'?1.35:.55);
  for(let i=0;i<2;i++){
    damageFrontlineUnit(target,impact,{side:u.side,kind:'vehicle',type:'bmptRocket'});
    for(const other of frontline.units){
      if(other.dead||other.side===u.side||other===target||Math.abs(other.x-target.x)>=frontlineDefs.engineer.splash)continue;
      let splash=d.rocketDamage*.38*(other.kind==='vehicle'?1.35:.55);
      damageFrontlineUnit(other,splash,{side:u.side,kind:'vehicle',type:'bmptRocket'})
    }
    frontline.shots.push({
      x1:u.x+u.side*24,y1:u.y-31+i*9,x2:target.x,y2:target.y-18+i*3,
      t:.34+i*.08,maxT:.34+i*.08,side:u.side,type:'bmptRocket',
      projectile:'rocket',rocketIndex:i
    })
  }
  frontline.fx.push({x:target.x,y:target.y-8,type:'blast',t:.48});
  u.bmptRocketFire=d.rocketRate
}

function updateFrontlineBmptRockets(dt){
  if(!frontline)return;
  let living=frontline.units.filter(u=>!u.dead);
  for(const u of living){
    if(u.type!=='bmpt')continue;
    u.bmptRocketFire=finite(u.bmptRocketFire,rnd(.4,1.2))-dt;
    if(u.bmptRocketFire>0)continue;
    let targets=living.filter(v=>v.side!==u.side&&!v.airborne&&Math.abs(v.x-u.x)<=frontlineVehicleDefs.bmpt.rocketRange);
    targets.sort((a,b)=>{
      let av=a.kind==='vehicle'?0:1,bv=b.kind==='vehicle'?0:1;
      return av-bv||Math.abs(a.x-u.x)-Math.abs(b.x-u.x)
    });
    let target=targets[0];
    if(target)frontlineBmptRocketVolley(u,target);
    else u.bmptRocketFire=.25
  }
}

const frontlineBmptUpdate=updateFrontlineMode;
updateFrontlineMode=function(dt){
  frontlineBmptUpdate(dt);
  if(frontline&&scene==='play')updateFrontlineBmptRockets(clamp(finite(dt,.016),0,.05))
};

// 坦克独立辅助武器与重装甲毒刺防护。
const frontlineAuxiliaryWeapons={
  m1:[
    {type:'mg',damage:12,rate:.16,range:310,label:'同轴机枪'},
    {type:'rifle',damage:14,rate:.68,range:205,label:'同轴步枪火力'}
  ],
  t90m:[{type:'rifle',damage:28,rate:.68,range:205,label:'双步枪同轴火力'}],
  hstv:[{type:'rifle',damage:14,rate:.68,range:205,label:'同轴机枪'}]
};

const frontlineAuxiliarySpawn=spawnFrontlineVehicle;
spawnFrontlineVehicle=function(type,side){
  let before=frontline?.units?.length||0,ok=frontlineAuxiliarySpawn(type,side);
  if(ok&&frontline.units.length>before){
    let u=frontline.units[frontline.units.length-1];
    if(frontlineAuxiliaryWeapons[type])u.auxiliaryFire=frontlineAuxiliaryWeapons[type].map((_,i)=>rnd(.15,.55)+i*.08);
    if(type==='m1'||type==='t90m')u.antiAirMgFire=rnd(.2,.6);
    if(type==='t90m'||type==='bmpt')u.stingerGuard=2
  }
  return ok
};

function frontlineAuxiliaryTarget(u,range,airborne=false){
  return frontline.units.filter(v=>!v.dead&&v.side!==u.side&&!!v.airborne===airborne&&Math.abs(v.x-u.x)<=range)
    .sort((a,b)=>{
      if(!airborne){let av=a.kind==='vehicle'?1:0,bv=b.kind==='vehicle'?1:0;if(av!==bv)return av-bv}
      return Math.abs(a.x-u.x)-Math.abs(b.x-u.x)
    })[0]
}

function frontlineAuxiliaryShot(u,target,weapon,index,antiAir=false){
  let attacker=antiAir
    ?{side:u.side,kind:'vehicle',type:'tankAAMg'}
    :{side:u.side,kind:'infantry',type:weapon.type,x:Infinity};
  damageFrontlineUnit(target,weapon.damage,attacker);
  frontline.shots.push({
    x1:u.x+u.side*(antiAir?5:29),y1:u.y-(antiAir?50:27)+index*4,
    x2:target.x,y2:target.y-(target.airborne?2:18),
    t:.1,maxT:.1,side:u.side,type:antiAir?'tankAAMg':`coax-${weapon.type}`,projectile:'bullet'
  })
}

function updateFrontlineTankAuxiliaryWeapons(dt){
  if(!frontline)return;
  for(const u of frontline.units){
    if(u.dead||u.kind!=='vehicle')continue;
    let weapons=frontlineAuxiliaryWeapons[u.type];
    if(weapons){
      u.auxiliaryFire=Array.isArray(u.auxiliaryFire)?u.auxiliaryFire:weapons.map(()=>0);
      for(let i=0;i<weapons.length;i++){
        let weapon=weapons[i];
        u.auxiliaryFire[i]=finite(u.auxiliaryFire[i],0)-dt;
        if(u.auxiliaryFire[i]>0)continue;
        let target=frontlineAuxiliaryTarget(u,weapon.range,false);
        if(target){frontlineAuxiliaryShot(u,target,weapon,i,false);u.auxiliaryFire[i]=weapon.rate}
        else u.auxiliaryFire[i]=.12
      }
    }
    if(u.type==='m1'||u.type==='t90m'){
      u.antiAirMgFire=finite(u.antiAirMgFire,0)-dt;
      if(u.antiAirMgFire<=0){
        let target=frontlineAuxiliaryTarget(u,310,true);
        if(target){
          frontlineAuxiliaryShot(u,target,{damage:12},0,true);
          u.antiAirMgFire=.16
        }else u.antiAirMgFire=.12
      }
    }
  }
}

const frontlineStingerGuardDamage=damageFrontlineUnit;
damageFrontlineUnit=function(u,n,attacker){
  let stinger=attacker&&String(attacker.type||'').toLowerCase().includes('stinger');
  if(u&&!u.dead&&u.kind==='vehicle'&&(u.type==='t90m'||u.type==='bmpt')&&stinger&&finite(u.stingerGuard,0)>0){
    u.stingerGuard--;
    n*=.12;

    if(u.side===1)message(`${frontlineVehicleDefs[u.type].name}复合防护吸收毒刺 · 剩余 ${u.stingerGuard}/2`)
  }
  frontlineStingerGuardDamage(u,n,attacker)
};

updateFrontlineMode=function(dt){

    x.fillStyle='#86a3a5';x.globalAlpha=.55;x.fillRect(-r*.13,-r*.41,r*.38,r*.22);x.fillRect(-r*.13,r*.17,r*.38,r*.22);x.globalAlpha=1;
    x.fillStyle=p.dark;x.fillRect(r*.4,-r*.39,r*.34,r*.78)
  }else{

  }

// Level-three zombie defenses combine the upgraded sniper tower with an
// independently aimed fixed machine-gun position.  Its 9 damage / .09 second
// cadence is deliberately identical to one friendly machine gunner.
updateFortressSnipers=function(dt){
  if(!zombieMode||!factory)return;
  const living=enemies.filter(e=>e.zombie&&!e.dead);
  for(const d of defenseLines){
    if(!d.segments)continue;
    for(const s of d.segments){
      if(s.level!==3||s.hp<=0||s.breached)continue;
      const a=defensePoint(d,s.index),b=defensePoint(d,s.index+1);
      const base={x:(a.x+b.x)/2,y:(a.y+b.y)/2,r:9,friendly:true};

      s.fire=finite(s.fire,0)-dt;
      if(s.fire<=0){
        let target=null,nearest=1050;
        for(const z of living){let distance=dist(z,base);if(distance<nearest){nearest=distance;target=z}}
        if(target){
          s.aim=Math.atan2(target.y-base.y,target.x-base.x);
          shoot({...base,fortress:true},s.aim,90,1250,rnd(-.006,.006));
          s.fire=.74
        }
      }

      s.mgFire=finite(s.mgFire,0)-dt;
      if(s.mgFire<=0){
        let target=null,nearest=490;
        for(const z of living){let distance=dist(z,base);if(distance<nearest){nearest=distance;target=z}}
        if(target){
          s.mgAim=Math.atan2(target.y-base.y,target.x-base.x);
          shoot({...base,type:'fortressMg'},s.mgAim,9,850,rnd(-.05,.05));
          s.mgFire=.09
        }
      }
    }
  }
};

// Give main battle tanks a clear anti-zombie role while retaining the Titan's
// resistance to ordinary bullets.  AP from an MBT always overkills a large
// zombie, and a Stinger removes at least 52% of a large zombie's maximum HP.
prepareTitanArmorEffects=function(){
  for(const b of bullets){
    if(b._baseDamage===undefined)b._baseDamage=b.damage;
    b.damage=b._baseDamage;
    if(b.from!=='p')continue;
    const speed=Math.hypot(b.vx,b.vy)||1,ux=b.vx/speed,uy=b.vy/speed;
    const target=enemies.filter(e=>e.zombie&&!e.dead).map(e=>{
      const dx=e.x-b.x,dy=e.y-b.y;
      return {e,along:dx*ux+dy*uy,perp:Math.abs(dx*uy-dy*ux)}
    }).filter(h=>h.along>0&&h.along<320&&h.perp<h.e.r+18).sort((a,c)=>a.along-c.along)[0];
    if(!target)continue;
    const e=target.e,mbt=b.owner&&(b.owner.type==='m1'||b.owner.type==='t90m');
    if(mbt&&b.shell){
      if(b.shellKind==='ap'&&e.large)b.damage=Math.max(b.damage,e.maxHp*3);
      else b.damage*=2.2
    }
    if(e.large&&b.missile==='stinger'){
      b.damage=Math.max(b.damage,e.maxHp*.52)
    }else if(e.titan&&!(mbt&&b.shell)){
      const anti=b.shellKind==='heat'||b.shellKind==='ap'||b.missile;
      b.damage=b._baseDamage*(anti?4:(b.shell?.65:.05))
    }
  }
};

// Final frontline balance pass: MBTs breach fixed trench weapons, Stingers are
// a stronger helicopter counter, and friendly trench upgrades return sooner.
const frontlineAntiEmplacementDamage=damageFrontlineUnit;
damageFrontlineUnit=function(u,n,attacker){
  if(u?.kind==='emplacement'){
    if(attacker?.type==='m1'||attacker?.type==='t90m')n*=attacker.type==='m1'?18:16;
    else if(attacker?.type==='hstv')n*=5;
    if(String(attacker?.type||'').toLowerCase().includes('stinger'))n*=5
  }
  if(u?.airborne&&String(attacker?.type||'').toLowerCase().includes('stinger'))n*=1.65;
  frontlineAntiEmplacementDamage(u,n,attacker)
};

const frontlineFasterFriendlyFortify=frontlineFortify;
frontlineFortify=function(enemy=false){
  const trench=!enemy?selectedFrontlineTrench():frontlineNearestTrench(-1);
  const before=trench?.fort;
  const upgraded=frontlineFasterFriendlyFortify(enemy);
  if(upgraded&&!enemy&&trench&&trench.fort>before){
    trench.fortifyCooldown=8+finite(trench.turretLosses,0)*2
  }
  return upgraded
};

// If a side loses every trench, newly deployed infantry must counterattack the
// nearest lost line instead of keeping the old invalid target index (-1).
const frontlineLostRearTrenchRecovery=updateFrontlineUnits;
updateFrontlineUnits=function(dt){
  if(frontline?.lines?.length){
    for(const u of frontline.units){
      if(u.dead||u.kind==='vehicle'||u.kind==='emplacement'||Number.isInteger(u.trenchIndex)||u.targetHQ)continue;
      if(!Number.isInteger(u.targetTrenchIndex)||u.targetTrenchIndex<0||u.targetTrenchIndex>=frontline.lines.length){
        u.targetTrenchIndex=frontlineRearTrenchIndex(u.side);
        u.targetHQ=false
      }
    }
  }
  frontlineLostRearTrenchRecovery(dt)
};

// Emplacements temporarily clear trenchIndex while the general unit mover runs.
// Recover the owning trench from emplacementKey when a turret dies in that exact
// frame, otherwise its unchanged fort level would instantly respawn it at full HP.
const frontlinePersistentEmplacementDamage=damageFrontlineUnit;
damageFrontlineUnit=function(u,n,attacker){
  const wasEmplacement=u?.kind==='emplacement'&&!u.dead;
  let trenchIndex=Number.isInteger(u?.trenchIndex)?u.trenchIndex:Number.parseInt(String(u?.emplacementKey||'').split(':')[0],10);
  const trench=wasEmplacement&&Number.isInteger(trenchIndex)?frontline?.lines?.[trenchIndex]:null;
  const lossesBefore=finite(trench?.turretLosses,0);
  frontlinePersistentEmplacementDamage(u,n,attacker);
  if(wasEmplacement&&u.dead&&trench&&trench.owner===u.side){
    u.trenchIndex=trenchIndex;
    trench.fort=u.type==='trenchAt'?Math.min(trench.fort,2):1;
    if(finite(trench.turretLosses,0)===lossesBefore){
      trench.turretLosses=lossesBefore+1;
      trench.fortifyCooldown=Math.min(25,5+lossesBefore*5)
    }
    u._downgradeHandled=true
  }
};

// Adaptive enemy deployment: spend the same command-point economy on counters
// instead of choosing a mostly random infantry type every cycle.
updateFrontlineEnemyAI=function(dt){
  if(!frontline)return;
  frontline.enemyThink=finite(frontline.enemyThink,1.8)-dt;
  if(frontline.enemyThink>0)return;
  frontline.enemyThink=rnd(2.15,3.05);

  const living=frontline.units.filter(u=>!u.dead),ours=living.filter(u=>u.side===1),theirs=living.filter(u=>u.side===-1);
  const oursInf=ours.filter(u=>u.kind!=='vehicle'&&u.kind!=='emplacement').length;
  const oursArmor=ours.filter(u=>u.kind==='vehicle'&&!u.airborne).length;
  const oursMg=ours.filter(u=>u.type==='mg').length;
  const oursSniper=ours.filter(u=>u.type==='sniper').length;
  const enemyInf=theirs.filter(u=>u.kind!=='vehicle'&&u.kind!=='emplacement').length;
  const enemyMg=theirs.filter(u=>u.type==='mg').length;
  const enemyEngineer=theirs.filter(u=>u.type==='engineer').length;
  const enemySniper=theirs.filter(u=>u.type==='sniper').length;
  const hasCommander=theirs.some(u=>u.type==='commander');
  const pressure=frontline.lines.filter(t=>t.owner===1).length/frontline.lines.length;

  const scores={
    rifle:4+Math.max(0,oursInf-enemyInf)*.28,
    mg:3+oursInf*.34+pressure*2.4-enemyMg*1.25,
    engineer:2+oursArmor*2.35-enemyEngineer*1.6,
    sniper:2+oursMg*1.7+oursSniper*.45-enemySniper*1.15,
    commander:!hasCommander&&enemyInf>=4?7+enemyInf*.22:-99
  };
  const choices=Object.keys(scores).filter(type=>{
    const d=frontlineDefs[type];
    return d&&frontlineInfantryUnlocked(type)&&frontline.enemyPoints>=d.cost&&finite(frontline.enemyCooldowns[type],0)<=0
  }).map(type=>({type,score:scores[type]*rnd(.94,1.06)})).sort((a,b)=>b.score-a.score);
  if(choices.length)buyFrontlineUnit(choices[0].type,true)
};

function updateFrontlineEnemyTrenchDoctrine(dt){
  if(!frontline?.lines?.length)return;
  const owned=[];
  for(let i=0;i<frontline.lines.length;i++)if(frontline.lines[i].owner===-1)owned.push(i);
  if(!owned.length)return;

  const frontIndex=Math.min(...owned),front=frontline.lines[frontIndex];
  const state=frontline.enemyAssaultDoctrine||(frontline.enemyAssaultDoctrine={active:false,timer:0,cooldown:4,frontIndex});
  state.timer=Math.max(0,finite(state.timer,0)-dt);
  state.cooldown=Math.max(0,finite(state.cooldown,0)-dt);

  // Rear positions pass reinforcements forward; only the foremost trench waits.
  for(const index of owned)frontline.lines[index].enemyOrder=index===frontIndex?0:1;

  if(state.frontIndex!==frontIndex){
    state.frontIndex=frontIndex;
    state.active=false;
    state.timer=0;
    state.cooldown=Math.max(state.cooldown,3.5)
  }

  const staged=frontline.units.filter(u=>!u.dead&&u.side===-1&&u.kind!=='vehicle'&&u.kind!=='emplacement'&&(u.trenchIndex===frontIndex||Math.abs(u.x-front.x)<42)).length;
  const threshold=Math.max(5,7-Math.floor(frontlineLevel/3));

  if(state.active){
    front.enemyOrder=1;
    if(state.timer<=0){
      state.active=false;
      state.cooldown=rnd(6,9);
      front.enemyOrder=0
    }
  }else if(state.cooldown<=0&&staged>=threshold){
    state.active=true;
    state.timer=rnd(5.5,7.5);
    front.enemyOrder=1;
    message(`敌军前沿集结 ${staged} 人，开始集团进攻`)
  }

  state.staged=staged;
  state.threshold=threshold
}

updateFrontlineEnemyStrategy=function(dt){
  if(!frontline)return;
  updateFrontlineEnemyTrenchDoctrine(dt);
  frontline.enemyStrategyTimer=finite(frontline.enemyStrategyTimer,2.5)-dt;
  if(frontline.enemyStrategyTimer>0)return;
  frontline.enemyStrategyTimer=rnd(4.4,6.2);

  const living=frontline.units.filter(u=>!u.dead),ours=living.filter(u=>u.side===1),theirs=living.filter(u=>u.side===-1);
  const air=ours.filter(u=>u.airborne).length;
  const enemyAA=theirs.filter(u=>u.type==='humvee_aa').length;
  if(air>0&&enemyAA<Math.max(1,Math.ceil(air/2))&&frontline.enemyPoints>=frontlineVehicleDefs.humvee_aa.cost&&finite(frontline.enemyVehicleCooldowns.humvee_aa,0)<=0){
    buyFrontlineVehicle('humvee_aa',true);
    return
  }

  const armor=ours.filter(u=>u.kind==='vehicle'&&!u.airborne).length;
  const engineers=theirs.filter(u=>u.type==='engineer').length;
  if(armor>=2&&engineers<Math.ceil(armor/2)&&frontline.enemyPoints>=frontlineDefs.engineer.cost&&finite(frontline.enemyCooldowns.engineer,0)<=0){
    buyFrontlineUnit('engineer',true);
    return
  }

  const front=frontlineNearestTrench(-1);
  if(front&&front.fort<3&&finite(front.fortifyCooldown,0)<=0){
    const friendlyPressure=ours.filter(u=>Math.abs(u.x-front.x)<260).length;
    const defenders=theirs.filter(u=>Math.abs(u.x-front.x)<220).length;
    const cost=8+front.fort*5;
    if(frontline.enemyPoints>=cost&&(friendlyPressure>=defenders||frontline.lines.filter(t=>t.owner===1).length>=Math.ceil(frontline.lines.length/2))){
      frontlineFortify(true);
      syncFrontlineTrenchTurrets();
      return
    }
  }

  const enemyInf=theirs.filter(u=>u.kind!=='vehicle'&&u.kind!=='emplacement').length;
  if(enemyInf>=5&&!theirs.some(u=>u.type==='commander')&&frontline.enemyPoints>=frontlineDefs.commander.cost&&finite(frontline.enemyCooldowns.commander,0)<=0){
    buyFrontlineUnit('commander',true)
  }
};

// Apache Stingers may engage fixed trench weapons as ground targets; dedicated
// AA Humvees remain air-only so their battlefield role does not change.
updateFrontlineApache=function(dt){
  if(!frontline)return;
  for(const u of frontline.units){
    if(u.dead||u.type!=='apache')continue;
    u.missileFire=finite(u.missileFire,0)-dt;
    if(u.missileFire>0)continue;
    const target=frontline.units.filter(v=>!v.dead&&v.side!==u.side&&(v.kind==='vehicle'||v.kind==='emplacement'))
      .sort((a,b)=>(a.kind==='emplacement'?0:1)-(b.kind==='emplacement'?0:1)||Math.abs(a.x-u.x)-Math.abs(b.x-u.x))[0];
    if(!target||Math.abs(target.x-u.x)>620)continue;

    frontline.shots.push({x1:u.x+u.side*22,y1:u.y,x2:target.x,y2:target.y-20,t:.42,maxT:.42,side:u.side,type:'apacheStinger',projectile:'rocket',stinger:true});
    frontline.fx.push({x:target.x,y:target.y-8,type:'blast',t:.45});
    u.missileFire=1
  }
};

function deployFrontlineTransportSquad(vehicle,trench){
  const trenchIndex=frontline.lines.indexOf(trench),types=['mg','rifle','rifle','rifle'],offsets=[-24,-8,9,25];
  let deployed=0;
  for(let i=0;i<types.length;i++){
    const before=frontline.units.length;
    if(!spawnFrontlineUnit(types[i],vehicle.side)||frontline.units.length<=before)continue;
    const soldier=frontline.units[frontline.units.length-1];
    soldier.x=trench.x+offsets[i]*vehicle.side;
    soldier.y=frontline.ground+3;
    soldier.trenchIndex=trenchIndex;
    soldier.targetTrenchIndex=null;
    soldier.targetHQ=false;
    soldier.angle=vehicle.side===1?0:Math.PI;
    if(soldier.type==='mg')soldier.mgSetup=.5;
    deployed++
  }
  vehicle.transportDeployed=true;
  if(deployed)message(`${vehicle.side===1?'我军':'敌军'}${frontlineVehicleDefs[vehicle.type].name}抵达前沿，步兵班已下车`)
}

const frontlineTransportDeploymentUpdate=updateFrontlineMode;
updateFrontlineMode=function(dt){
  frontlineTransportDeploymentUpdate(dt);
  if(!frontline||scene!=='play')return;
  for(const vehicle of frontline.units){
    if(vehicle.dead||!['humvee','apc'].includes(vehicle.type)||vehicle.transportDeployed)continue;
    const front=frontlineNearestTrench(vehicle.side);
    if(!front)continue;
    if(Math.abs(vehicle.x-front.x)<=58)deployFrontlineTransportSquad(vehicle,front)
  }
};

function visualV2Ready(image){
  return image?.complete&&image.naturalWidth>0
}

function drawVisualV2Terrain(){
  const image=zombieMode?visualV2.terrain.zombie:visualV2.terrain.battlefield;
  if(!visualV2Ready(image))return;
  const tile=zombieMode?560:620,offsetX=-((finite(cam.x,0)*.32)%tile),offsetY=48-((finite(cam.y,0)*.32)%tile);
  x.save();
  x.beginPath();x.rect(0,48,W,H-143);x.clip();
  x.globalAlpha=zombieMode?.2:training?.12:.18;
  x.globalCompositeOperation=zombieMode?'multiply':'soft-light';
  for(let yy=offsetY-tile;yy<H;yy+=tile)for(let xx=offsetX-tile;xx<W;xx+=tile)x.drawImage(image,xx,yy,tile,tile);
  x.globalCompositeOperation='source-over';
  const wash=x.createLinearGradient(0,48,0,H-95);
  wash.addColorStop(0,zombieMode?'rgba(18,25,25,.16)':'rgba(205,190,145,.045)');
  wash.addColorStop(1,zombieMode?'rgba(4,8,9,.28)':'rgba(6,12,8,.12)');
  x.fillStyle=wash;x.fillRect(0,48,W,H-143);
  x.restore()
}

      x.save();x.translate(q.x,q.y);x.shadowColor='#020403aa';x.shadowBlur=8;x.drawImage(image,-w/2,-h/2,w,h);x.restore();
      continue
    }
    x.save();x.translate(q.x,q.y);
    x.fillStyle='#10171555';x.fillRect(-r*.76,-r*.57,r*1.52,r*1.14);
    x.strokeStyle='#c1c7b744';x.lineWidth=1.2;x.strokeRect(-r*.7,-r*.52,r*1.4,r*1.04);

function drawVisualV2DefenseFragment(image,len,height,alpha=1){
  if(!visualV2Ready(image))return;
  x.globalAlpha=alpha;
  x.drawImage(visualV4CachedSprite(image,256,96),-len/2,-height/2,len,height);
  x.globalAlpha=1
}

function drawVisualV2Defenses(){
  if(!zombieMode||!factory)return;
  const sprites=visualV2.defenses;
  for(const line of defenseLines||[]){
    if(!line.segments)continue;
    for(let i=0;i<line.segments.length;i++){
      const segment=line.segments[i],start=world(defensePoint(line,i)),end=world(defensePoint(line,i+1));
      const length=Math.hypot(end.x-start.x,end.y-start.y),mx=(start.x+end.x)/2,my=(start.y+end.y)/2;
      if(mx+length/2<-70||mx-length/2>W+70||my<-70||my>H+70)continue;
      const angle=Math.atan2(end.y-start.y,end.x-start.x);
      const type=segment.level===0?'trench':segment.level===1?'wire':'wall';
      const image=sprites[type],height=segment.level===0?38:segment.level===1?35:43;
      if(!visualV2Ready(image))continue;
      x.save();x.translate(mx,my);x.rotate(angle);
      x.fillStyle='rgba(4,7,6,.5)';x.beginPath();x.ellipse(3,5,length*.47,height*.36,0,0,7);x.fill();
      const health=clamp(finite(segment.hp,0)/Math.max(1,finite(segment.max,1)),0,1);
      if(segment.hp<=0||segment.breached){
        const fragment=Math.max(18,length*.29),sourceWidth=image.naturalWidth*.43;
        x.globalAlpha=.38+.38*health;
        x.drawImage(image,0,0,sourceWidth,image.naturalHeight,-length*.47,-height/2,fragment,height);
        x.drawImage(image,image.naturalWidth-sourceWidth,0,sourceWidth,image.naturalHeight,length*.47-fragment,-height/2,fragment,height);
        x.globalAlpha=1;
        x.fillStyle='rgba(22,16,12,.78)';
        for(const offset of[-12,1,14]){x.save();x.translate(offset,(offset%5)-2);x.rotate(offset*.035);x.fillRect(-7,-4,14,8);x.restore()}
      }else{
        drawVisualV2DefenseFragment(image,length+8,height,.62+.38*health);
        if(segment.hit>0){
          x.fillStyle=`rgba(255,134,60,${clamp(segment.hit,0,.2)*2})`;
          x.fillRect(-length/2,-height/2,length,height)
        }
      }
      x.restore()
    }
  }
  const fortress=sprites.fortress;
  if(!visualV2Ready(fortress))return;
  for(const line of defenseLines||[])for(const segment of line.segments||[]){
    if(segment.level!==3||segment.hp<=0||segment.breached)continue;
    const start=defensePoint(line,segment.index),end=defensePoint(line,segment.index+1);
    const q=world({x:(start.x+end.x)/2,y:(start.y+end.y)/2}),angle=Math.atan2(end.y-start.y,end.x-start.x);
    const width=104,height=width*fortress.naturalHeight/fortress.naturalWidth;
    x.save();x.translate(q.x,q.y);x.rotate(angle);
    x.shadowColor='rgba(0,0,0,.72)';x.shadowBlur=7;
    x.drawImage(visualV4CachedSprite(fortress,256,128),-width/2,-height/2,width,height);x.shadowBlur=0;
    const aim=finite(segment.aim,angle)-angle;
    x.rotate(aim);x.fillStyle='#171c1a';x.fillRect(2,-2,37,4);
    x.fillStyle='#777f78';x.beginPath();x.arc(1,0,7,0,7);x.fill();x.restore()
  }
}

function zombieVisualType(zombie){
  if(zombie.zombieKind&&visualV2.zombies[zombie.zombieKind])return zombie.zombieKind;
  if(zombie.titan)return'titan';
  if(zombie.large||zombie.type==='brute')return'brute';
  return finite(zombie.speed,0)>120?'runner':'walker'
}

function drawVisualV2Zombies(){
  if(!zombieMode)return;
  const now=performance.now()/1000;
  const sizes={walker:62,runner:68,brute:102,titan:142};
  for(const zombie of enemies||[]){
    if(!zombie.zombie||zombie.dead)continue;
    const type=zombieVisualType(zombie),image=visualV2.zombies[type];
    if(!visualV2Ready(image))continue;
    const q=world(zombie),w=sizes[type],h=w*image.naturalHeight/image.naturalWidth;
    if(q.x<-w||q.x>W+w||q.y<48-h||q.y>H-95+h)continue;
    const cadence=type==='runner'?13:type==='titan'?3.5:type==='brute'?5:7;
    const stride=Math.sin(now*cadence+zombie.x*.035+zombie.y*.018);
    const moving=!zombie._blockedDefense&&finite(zombie.speed,0)>0;
    const bob=moving?stride*(type==='titan'?1:1.7):0;
    const sway=moving?stride*(type==='runner'?.06:type==='titan'?.018:.035):0;
    x.save();
    x.translate(q.x,q.y+bob);
    x.rotate(finite(zombie.angle,0)+sway);
    x.fillStyle='rgba(3,5,4,.58)';
    x.beginPath();x.ellipse(-w*.07,7,w*.34,Math.max(7,h*.25),0,0,7);x.fill();
    if(zombie.bloodMoon){
      x.shadowColor='#d32028';x.shadowBlur=18;
      x.fillStyle='rgba(190,18,25,.17)';x.beginPath();x.ellipse(0,0,w*.48,h*.45,0,0,7);x.fill()
    }
    x.shadowColor=zombie.bloodMoon?'#bd2025':'rgba(45,10,8,.7)';
    x.shadowBlur=zombie.bloodMoon?10:4;

// 模块化运行层：集中处理自适应丧尸更新、战线音效和持续环境声。
advanceZombies=function(dt){
  if(!zombieMode||!factory)return;
  const living=enemies.filter(z=>z.zombie&&!z.dead);
  const defenders=[player,...allies.filter(a=>!a.dead),...vehicles.filter(v=>!v.dead)];
  const defenderGrid=GamePerformance.grid('zombie-defenders',defenders);
  const stride=GamePerformance.zombieStride(living.length);
  for(let i=0;i<living.length;i++){
    const z=living[i];
    z.damage=Math.max(60,finite(z.damage,60));
    z._blockedDefense=null;
    let blocked=null;
    for(const line of defenseLines){
      const hit=closestDefenseSegment(line,z);
      if(hit&&hit.distance<z.r+11&&(!blocked||line.radius>blocked.line.radius))blocked={line,segment:hit.segment}
    }
    if(blocked){
      z._blockedDefense=blocked;
      continue
    }
    const nearby=defenderGrid.query(z.x,z.y,175);
    const near=GamePerformance.nearest(nearby,z,null,175);
    const target=near||factory;
    const distance=dist(z,target);
    z.angle=Math.atan2(target.y-z.y,target.x-z.x);
    const urgent=Boolean(near)||distance<220;
    if(!GamePerformance.shouldSimulate(i,stride,urgent))continue;
    if(distance>z.r+(target.r||22)+5)smartMove(z,z.angle,z.speed,Math.min(.12,dt*stride),z.r)
  }
};

function updateFrontlineAudio(){
  if(!frontlineMode||!frontline)return;
  const listener={x:W/2,y:frontline.ground};
  for(const shot of frontline.shots){
    if(shot._audioPlayed)continue;
    shot._audioPlayed=true;
    const type=String(shot.type||'rifle');
    const rocket=shot.projectile==='rocket'||shot.stinger||/rocket|stinger|missile|engineer|rpg/i.test(type);
    const cannon=!rocket&&/m1|t90|hstv|tank|trenchAt|artillery/i.test(type);
    const automatic=/bmpt|apc|cm34|mg|hqTurret|autocannon/i.test(type);
    const owner={x:shot.x1,y:shot.y1,type:rocket?'engineer':automatic?'mg':type,main:cannon};
    const projectile={shellKind:cannon?'ap':undefined,missile:rocket?'stinger':undefined};
    GameAudio.playWeapon(owner,projectile,listener)
  }
  for(const effect of frontline.fx){
    if(effect._audioPlayed)continue;
    effect._audioPlayed=true;
    if(effect.type==='blast'||effect.type==='artillery'||effect.type==='aps')GameAudio.playExplosion(effect,listener)
  }
}

// 炮塔模块仅造成渐进转速下降；完好状态保持原来的即时瞄准手感。
const directInputWorld=inputWorld;
inputWorld=function(){
  const target=directInputWorld(),v=player?.inVehicle,modifier=v?.moduleModifiers?.traverse;
  if(!v||!Number.isFinite(modifier)||modifier>=.995)return target;
  const now=performance.now(),dt=Math.min(.05,Math.max(0,(now-finite(v._moduleAimTime,now))/1000));
  v._moduleAimTime=now;
  const desired=Math.atan2(target.y-v.y,target.x-v.x);
  const angle=VehicleModuleSystem.rotateTowards(v.turret,desired,2.8*modifier*dt);
  const reach=Math.max(400,dist(v,target));
  return{x:v.x+Math.cos(angle)*reach,y:v.y+Math.sin(angle)*reach}
};

updateVehicles=function(dt){
  for(const v of [...vehicles,...enemyVehicles]){
    if(v.dead)continue;
    const moved=Math.hypot(v.x-(v.prevX??v.x),v.y-(v.prevY??v.y))>.2;
    v.stationary=moved?0:v.stationary+dt;v.prevX=v.x;v.prevY=v.y;
    v.lastDamage=Math.max(0,v.lastDamage-dt);
    const crewCount=vehicleCrewCount(v),moduleModifiers=VehicleModuleSystem.update(v,dt,crewCount);
    if(v.baseReload)v.reload*=moduleModifiers.reload;
    if(v.stationary>=2&&v.lastDamage<=0&&crewCount>0&&v.hp<v.max){
      v.hp=Math.min(v.max,v.hp+(2+crewCount*2.4)*dt);
      if(v.disabled&&v.hp>=v.max*.2){v.disabled=false;message('载具维修完成，恢复机动')}
    }
    if(player.inVehicle===v)boardNearbyAllies(v);
    updateApcSideGuns(v,dt);
    if(!v.enemy)continue;
    if(crewCount<=0){v.disabled=true;continue}
    const target=chooseEnemyTarget(v);
    if(!target)continue;
    const distance=dist(v,target),desired=Math.atan2(target.y-v.y,target.x-v.x);
    v.turret=moduleModifiers.traverse>=.995?desired:VehicleModuleSystem.rotateTowards(v.turret,desired,2.65*moduleModifiers.traverse*dt);
    v.fire-=dt;v.coaxFire-=dt;v.aaFire-=dt;
    if((distance>vehiclePreferredRange(v)||!hasLineOfSight(v,target))&&!v.disabled){
      v.angle=desired;smartMove(v,desired,v.move*.46,dt,v.r,v)
    }
    const aimTolerance=v.main ? .17 : v.gun ? .24 : .32;
    if(angleDiff(v.turret,desired)<=aimTolerance)fireAiVehicleWeapons(v,target)
  }
};

function visualV4Hash(a,b=0,c=0){
  let n=(Math.floor(a)*374761393+Math.floor(b)*668265263+Math.floor(c)*2147483647)>>>0;
  n=(n^(n>>>13))*1274126177>>>0;
  return(n^(n>>>16))>>>0
}

function visualV4Random(seed){
  let state=seed>>>0;
  return()=>((state=(Math.imul(state,1664525)+1013904223)>>>0)/4294967296)
}

function visualV4Quality(){
  const selected=GameSettings?.get?.('renderQuality')||'auto',adaptive=selected==='auto'?finite(GamePerformance?.state?.quality,1):1;
  return clamp(adaptive*(GameSettings?.qualityMultiplier?.()??1),.4,1)
}

function visualV4CachedSprite(image,width,height){

  const w=Math.max(1,Math.round(width)),h=Math.max(1,Math.round(height)),key=`${w}x${h}`;

  const context=canvas.getContext('2d',{alpha:true});

}

function visualV4BuildingImage(c){
  const oldTypes=zombieMode?['ruined-house','warehouse','ruined-house','armory']:['bunker','warehouse','ruined-house','armory'];

  const seed=visualV4Hash(c.x,c.y,level);

}

function visualV4InfantryFiring(unit){
  if(unit===player){
    const rates=[.125,.83,.075,1.35,1,1],rate=rates[player.weapon]||.2;
    return finite(unit.fire,0)>Math.max(.02,rate-.09)&&finite(unit.fire,0)<=rate+.02
  }
  const rate=finite(unit.rate,0);
  return rate>0&&finite(unit.fire,0)>Math.max(.025,rate-.085)&&finite(unit.fire,0)<=rate+.02
}

function visualV4VehicleMuzzle(v,q,w,h,recoil){
  const mainShot=Number.isFinite(v.fire)&&v.baseReload&&v.fire>v.baseReload-.14;
  const cannonShot=!v.main&&v.gun&&Number.isFinite(v.fire)&&v.fire>.025&&v.fire<.16;
  const coaxShot=Number.isFinite(v.coaxFire)&&v.coaxFire>.025&&v.coaxFire<.16;
  if(!mainShot&&!cannonShot&&!coaxShot)return;
  const angle=finite(v.turret,finite(v.angle,0)),distance=mainShot?w*.57:cannonShot?w*.52:w*.43;
  const px=q.x+Math.cos(angle)*(distance-recoil),py=q.y+Math.sin(angle)*(distance-recoil),size=mainShot?22:cannonShot?12:8;
  x.save();x.translate(px,py);x.rotate(angle);x.fillStyle='#fff2a1';x.shadowColor='#ff8a2d';x.shadowBlur=mainShot?22:13;
  x.beginPath();x.moveTo(-2,-size*.38);x.lineTo(size,0);x.lineTo(-2,size*.38);x.closePath();x.fill();x.restore()
}

function drawVisualV4VehicleDamage(v,q,w,h){

  if(ratio>=.68)return;
  const time=performance.now()/1000+v.x*.01;
  x.save();
  const smokeAlpha=(.68-ratio)*.78;
  for(let i=0;i<(visualV4Quality()>.68?4:2);i++){
    const rise=(time*(12+i*3)+i*19)%42;
    x.fillStyle=`rgba(${ratio<.2?'44,37,29':'42,48,43'},${smokeAlpha*(1-rise/52)})`;
    x.beginPath();x.arc(q.x-7+Math.sin(time*1.7+i)*10,q.y-h*.26-rise,6+i*2+rise*.08,0,7);x.fill()
  }
  if(ratio<.2){
    x.fillStyle='rgba(255,107,36,.72)';x.shadowColor='#ff6b25';x.shadowBlur=13;
    x.beginPath();x.moveTo(q.x-7,q.y-h*.2);x.quadraticCurveTo(q.x-15,q.y-h*.46,q.x-2,q.y-h*.56);x.quadraticCurveTo(q.x+9,q.y-h*.34,q.x+5,q.y-h*.18);x.fill()
  }

  }
  x.restore()
}

function visualV4UpdateTopDownMotion(dt){
  visualV4SyncWorld();
  const quality=visualV4Quality();
  for(const v of [...(vehicles||[]),...(enemyVehicles||[])]){
    if(v.dead||v.airborne)continue;
    const previousX=finite(v._v4X,v.x),previousY=finite(v._v4Y,v.y),travel=Math.hypot(v.x-previousX,v.y-previousY);
    v._v4X=v.x;v._v4Y=v.y;
    if(travel>150){v._v4TrackAccum=0;continue}
    v._v4TrackAccum=finite(v._v4TrackAccum,0)+travel;
    const spacing=['humvee','apc','humvee_aa'].includes(v.type)?24:18;
    if(v._v4TrackAccum>=spacing&&travel>.15){
      v._v4TrackAccum%=spacing;
      visualV4.tracks.push({x:v.x-Math.cos(v.angle)*v.r*.45,y:v.y-Math.sin(v.angle)*v.r*.45,angle:v.angle,width:v.r*.58,length:spacing*1.25,wheeled:['humvee','apc','humvee_aa'].includes(v.type),life:42});
      if(visualV4.tracks.length>190)visualV4.tracks.splice(0,visualV4.tracks.length-190);
      if(Math.random()<.38*quality*(GameSettings?.particleMultiplier?.()??1))visualV4.particles.push({type:'dust',x:v.x-Math.cos(v.angle)*v.r,y:v.y-Math.sin(v.angle)*v.r,vx:rnd(-8,8),vy:rnd(-8,8),life:.7,max:.7,size:rnd(5,11)})
    }
  }
  for(const effect of effects||[]){
    if(effect._visualV4Recorded||effect.type!=='boom')continue;
    effect._visualV4Recorded=true;
    visualV4.scorches.push({x:effect.x,y:effect.y,size:clamp(finite(effect.r,70)*.38,20,62),angle:Math.random()*Math.PI,life:70});
    if(visualV4.scorches.length>80)visualV4.scorches.shift()
  }
  for(const mark of visualV4.tracks)mark.life-=dt;
  for(const mark of visualV4.scorches)mark.life-=dt;
  visualV4.tracks=visualV4.tracks.filter(mark=>mark.life>0);
  visualV4.scorches=visualV4.scorches.filter(mark=>mark.life>0);
  for(const particle of visualV4.particles){particle.life-=dt;particle.x+=particle.vx*dt;particle.y+=particle.vy*dt;particle.size+=dt*9}
  visualV4.particles=visualV4.particles.filter(particle=>particle.life>0).slice(-120)
}

function visualV4UpdateFrontlineMotion(dt){
  visualV4SyncWorld();
  if(!frontline)return;
  for(const unit of frontline.units){
    const previous=finite(unit._v4MotionX,unit.x),travel=Math.abs(unit.x-previous);
    unit._v4MotionX=unit.x;unit._v4Speed=travel/Math.max(.001,dt);unit._v4Travel=finite(unit._v4Travel,0)+travel;
    if(unit.kind==='vehicle'&&travel>.25&&Math.random()<.12*visualV4Quality()){
      visualV4.frontlineDust.push({x:unit.x-unit.side*35,y:frontline.ground+8,life:.55,max:.55,size:rnd(4,9)})
    }
  }
  for(const dust of visualV4.frontlineDust){dust.life-=dt;dust.y-=dt*8;dust.size+=dt*10}
  visualV4.frontlineDust=visualV4.frontlineDust.filter(dust=>dust.life>0).slice(-80)
}

const visualV4UpdateBase=update;
update=function(dt){
  visualV4UpdateBase(dt);
  CombatFeedback?.update(dt);
  if(scene!=='play')return;
  const safeDt=clamp(finite(dt,.016),0,.05);
  if(frontlineMode)visualV4UpdateFrontlineMotion(safeDt);
  else visualV4UpdateTopDownMotion(safeDt)
};

function drawVisualV4Particles(){
  x.save();x.beginPath();x.rect(0,48,W,H-143);x.clip();
  for(const particle of visualV4.particles){
    const q=world(particle),alpha=clamp(particle.life/particle.max,0,1)*.2;
    x.fillStyle=`rgba(173,157,119,${alpha})`;x.beginPath();x.arc(q.x,q.y,particle.size,0,7);x.fill()
  }
  for(const effect of effects||[]){
    if(effect.type!=='boom'&&effect.type!=='flash'&&effect.type!=='aps')continue;
    const q=world(effect),radius=effect.type==='boom'?clamp(finite(effect.r,70)*.75,28,110):effect.type==='aps'?42:24;
    const glow=x.createRadialGradient(q.x,q.y,0,q.x,q.y,radius);
    glow.addColorStop(0,effect.type==='aps'?'rgba(95,215,255,.34)':'rgba(255,210,111,.38)');
    glow.addColorStop(1,'rgba(255,120,36,0)');
    x.globalCompositeOperation='screen';x.fillStyle=glow;x.beginPath();x.arc(q.x,q.y,radius,0,7);x.fill();x.globalCompositeOperation='source-over'
  }
  x.restore()
}

const visualV4WeatherBase=drawVisualV2Weather;
drawVisualV2Weather=function(){
  visualV4WeatherBase();
  drawVisualV4Particles();
  if(player&&finite(player.hurtTimer,0)>0&&(GameSettings?.get('damageVignette')??true)){
    const hurt=clamp(player.hurtTimer/2,0,1),damage=x.createRadialGradient(W/2,H/2,210,W/2,H/2,690);
    damage.addColorStop(.48,'rgba(85,0,0,0)');damage.addColorStop(1,`rgba(115,6,4,${hurt*.23})`);
    x.fillStyle=damage;x.fillRect(0,48,W,H-143)
  }
};

const visualV4FrontlineUnitBase=drawFrontlineStickman;
drawFrontlineStickman=function(unit){
  visualV4FrontlineUnitBase(unit);
  if(!frontline||unit.dead)return;
  if(unit.kind==='vehicle'){
    const widths={humvee:86,humvee_aa:88,apc:103,hstv:108,bmpt:113,m1:122,t90m:120,apache:132},width=widths[unit.type]||104;
    const tracked=['hstv','bmpt','m1','t90m'].includes(unit.type),phase=finite(unit._v4Travel,0);
    if(unit.type!=='apache'){
      x.save();x.translate(unit.x,unit.y+7);x.scale(unit.side,1);x.globalAlpha=.38;
      if(tracked){
        x.strokeStyle='#c2c4af';x.lineWidth=2.5;x.setLineDash([5,4]);x.lineDashOffset=-(phase%9);
        x.beginPath();x.moveTo(-width*.39,0);x.lineTo(width*.39,0);x.stroke();x.setLineDash([])
      }else{
        x.strokeStyle='#b8beac';x.lineWidth=1.7;
        for(const px of[-width*.3,width*.3]){x.save();x.translate(px,0);x.rotate(phase*.09);x.beginPath();x.arc(0,0,8,0,7);x.stroke();x.beginPath();x.moveTo(-6,0);x.lineTo(6,0);x.moveTo(0,-6);x.lineTo(0,6);x.stroke();x.restore()}
      }
      x.restore()
    }
    const def=frontlineDef(unit),fired=Number.isFinite(unit.fire)&&unit.fire>Math.max(.025,finite(def.rate,.2)-.095);
    if(fired){
      const px=unit.x+unit.side*width*.5,py=unit.y-(unit.type==='m1'||unit.type==='t90m'?37:24),size=unit.type==='m1'||unit.type==='t90m'?20:11;
      x.save();x.translate(px,py);x.scale(unit.side,1);x.fillStyle='#fff0a0';x.shadowColor='#ff8f35';x.shadowBlur=15;
      x.beginPath();x.moveTo(0,-size*.35);x.lineTo(size,0);x.lineTo(0,size*.35);x.fill();x.restore()
    }
    const ratio=clamp(finite(unit.hp,0)/Math.max(1,finite(unit.maxHp,1)),0,1);
    if(ratio<.56){
      const time=performance.now()/1000+unit.x*.01;
      x.fillStyle=`rgba(39,44,39,${(.56-ratio)*.62})`;
      for(let i=0;i<3;i++){x.beginPath();x.arc(unit.x-7+Math.sin(time+i)*7,unit.y-45-i*9,6+i*2,0,7);x.fill()}
    }
  }else if(unit.kind!=='emplacement'){
    const def=frontlineDef(unit),fired=Number.isFinite(unit.fire)&&unit.fire>Math.max(.025,finite(def.rate,.3)-.07);
    if(fired){
      x.save();x.translate(unit.x+unit.side*34,unit.y-28);x.scale(unit.side,1);x.fillStyle='#ffe89a';x.shadowColor='#ff963c';x.shadowBlur=9;
      x.beginPath();x.moveTo(0,-3);x.lineTo(10,0);x.lineTo(0,3);x.fill();x.restore()
    }
  }
};

const visualV4FrontlinePostBase=drawFrontlineVisualV2Post;
drawFrontlineVisualV2Post=function(){
  visualV4FrontlinePostBase();
  if(!frontline)return;
  x.save();x.beginPath();x.rect(0,64,W,514);x.clip();
  for(const dust of visualV4.frontlineDust){
    x.fillStyle=`rgba(180,163,124,${clamp(dust.life/dust.max,0,1)*.16})`;
    x.beginPath();x.arc(dust.x,dust.y,dust.size,0,7);x.fill()
  }
  const time=frontline.time;
  for(let i=0;i<6;i++){
    const px=150+i*221+Math.sin(time*.17+i)*25,baseY=frontline.ground-78-(i%2)*26;
    x.fillStyle=`rgba(45,49,43,${.035+(i%3)*.012})`;
    for(let p=0;p<3;p++){x.beginPath();x.arc(px+Math.sin(time*.3+i+p)*8,baseY-p*12,13+p*6,0,7);x.fill()}
  }
  x.restore()
};

const visualV4HudBase=drawVisualV2HudChrome;
drawVisualV2HudChrome=function(){
  visualV4HudBase();
  if(!player||scene!=='play')return;
  const actor=player.inVehicle||player,heading=((finite(actor.angle,0)*180/Math.PI+90)%360+360)%360;
  const points=['北','东北','东','东南','南','西南','西','西北'],direction=points[Math.round(heading/45)%8];
  x.save();
  x.fillStyle='rgba(6,12,9,.82)';x.beginPath();x.roundRect(W-154,57,136,31,3);x.fill();
  x.strokeStyle='#7e94715c';x.stroke();
  x.fillStyle='#d8c578';x.font='bold 11px Microsoft YaHei';x.fillText(`${direction}  ${Math.round(heading).toString().padStart(3,'0')}°`,W-140,76);
  x.fillStyle='#869787';x.font='9px Microsoft YaHei';x.textAlign='right';
  x.fillText(`视觉系统 V${visualV4.version}`,W-25,84);x.textAlign='left';x.restore()
};

const visualV4FrameBase=draw;
draw=function(){
  x.imageSmoothingEnabled=true;
  x.imageSmoothingQuality=visualV4Quality()>.84?'high':'medium';
  const shake=scene==='play'&&!frontlineMode?(CombatFeedback?.shakeOffset?.()||{x:0,y:0}):{x:0,y:0};
  x.save();x.translate(shake.x,shake.y);visualV4FrameBase();x.restore();
  if(scene==='play'&&!frontlineMode&&player)CombatFeedback?.draw(x,world,W,H,player.inVehicle||player)
};
})();
</script></body></html>
